# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

tasks:
  subset-font:
    desc: Regenerate the embedded serif subset; --text must cover every string drawn in src/greeting.cpp.
    cmds:
      - >-
        uvx --from fonttools pyftsubset assets/NotoSerifSC-VariableFont_wght.ttf
        --text='For.2024.宝宝:HappyBirthday' --name-IDs='*'
        --output-file=assets/NotoSerifSC-Subset.ttf

  configure:
    cmds:
      - cmake -B build -G "Ninja Multi-Config" .
    env:
      CMAKE_EXPORT_COMPILE_COMMANDS: true

  configure-windows:
    cmds:
      - cmake -B build-windows -G "Ninja Multi-Config" --toolchain cmake/x86_64-pc-windows-msvc.cmake .

  build-windows:
    deps: [configure-windows]
    cmds:
      - cmake --build build-windows --config Release
